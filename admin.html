      <script>(function(){var K="ff-theme",d=document.documentElement,m=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)");function saved(){try{return localStorage.getItem(K)}catch(e){return null}}function cur(){var s=saved();return s==="dark"?"dark":"light"}function apply(){var t=cur();d.setAttribute("data-theme",t);var b=document.getElementById("ff-theme");if(b){b.textContent=t==="dark"?"☀️":"🌙";b.setAttribute("aria-label",t==="dark"?"Switch to light mode":"Switch to dark mode");b.title=b.getAttribute("aria-label")}var tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content",t==="dark"?"#14100f":"#a60603")}apply();if(m&&m.addEventListener)m.addEventListener("change",function(){if(!saved())apply()});document.addEventListener("DOMContentLoaded",function(){var b=document.createElement("button");b.id="ff-theme";b.type="button";document.body.appendChild(b);b.addEventListener("click",function(){var n=cur()==="dark"?"light":"dark";try{localStorage.setItem(K,n)}catch(e){}apply()});apply()})})();</script>
